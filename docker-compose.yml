services:
  db:
    container_name: math_db
    build:
      context: ./API/docker
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d math"]
      interval: 5s
      timeout: 5s
      retries: 20

  user_api:
    container_name: math_user_api
    build:
      context: ./API
      dockerfile: docker/Dockerfile.userApi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8125:8080"

  teacher_api:
    container_name: math_teacher_api
    build:
      context: ./API
      dockerfile: docker/Dockerfile.teacherApi
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8126:8080"

  teacher_panel:
    container_name: math_teacher_panel
    build:
      context: ./teacher_pannel/app
      dockerfile: Dockerfile
    depends_on:
      - teacher_api
    ports:
      - "3000:3000"
